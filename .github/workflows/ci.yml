name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lak-travelers/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            lak-travelers/backend/package-lock.json
            lak-travelers/frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm ci
        working-directory: lak-travelers/frontend
      - run: npm run lint
        working-directory: lak-travelers/frontend
      - run: npm run build
        working-directory: lak-travelers/frontend
